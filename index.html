<!DOCTYPE html>
<html>
  <head>
    <title>Welcome Back</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>

      body {
        font-family: 'Poppins', sans-serif;
        background-color: #1c1b1b;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .login-box {
        background: rgb(51, 50, 50);
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        width: 350px;
        text-align: center;
      }

      h2 {
        color: #d7d5d5;
        margin-bottom: 5px;
      }

      p {
        color: rgb(153, 146, 146);
        font-size: 13px;
        margin-bottom: 25px;
      }

      label {
        display: block;
        text-align: left;
        font-size: 13px;
        font-weight: 600;
        color: #b5b5b5;
        margin-top: 15px;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        margin-top: 5px;
        border: 1.5px solid #595757;
        border-radius: 8px;
        font-size: 14px;
        font-family: 'Poppins', sans-serif;
        box-sizing: border-box;
      }

      input:focus {
        border-color: #000000;
        outline: none;
        box-shadow: 0 0 0 3px rgba(243,132,113,0.15);
      }

      button {
        width: 100%;
        margin-top: 25px;
        padding: 12px;
        background-color: #231d1c;
        color: rgb(255, 255, 255);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        font-family: 'Poppins', sans-serif;
        font-weight: 600;
      }

      button:hover {
        background-color: #0c0a0a;
      }

      .error {
        color: red;
        font-size: 13px;
        margin-top: 10px;
        margin-bottom: 0;
        display: none;
      }

    </style>
    </head>
    <body>

    <div class="login-box">
      <h2>Welcome Back</h2>
      <p>Login to check your tasks</p>

      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username" />

      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" />

      <p class="error" id="error-msg">❌ Incorrect username or password.</p>

      <button onclick="adminLogin()">Login</button>
      <div style="margin-top: 16px; padding: 10px 14px; background: #1a1a1a; border-radius: 8px; border: 1px solid #333; text-align: left;">
        <p style="font-size: 11px; color: #666; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">Demo credentials</p>
        <p style="font-size: 13px; color: #999;">Username: <span style="color: #d7d5d5; font-weight: 600;">Admin</span></p>
        <p style="font-size: 13px; color: #999; margin-top: 4px;">Password: <span style="color: #d7d5d5; font-weight: 600;">ad123</span></p>
      </div>
    </div>

    <script>
      function adminLogin() {
        var username = document.getElementById("username").value.trim();
        var password = document.getElementById("password").value.trim();

        // Admin credentials 
        var correctUsername = "Admin";
        var correctPassword = "ad123";

        if (username === correctUsername && password === correctPassword) {
          // Save login status and go to dashboard
          localStorage.setItem("adminLoggedIn", "true");
          window.location.href = "dashboard.html";
          
        } else {
          document.getElementById("error-msg").style.display = "block";
        }
      }
    </script>

  </body>
    </html>
